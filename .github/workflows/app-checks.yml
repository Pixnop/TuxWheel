name: App checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: app-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 0.1.2 is not yet on Maven Central; pin the authentication/speed-limit APIs from PR #74.
      - name: Checkout BLE library
        uses: actions/checkout@v4
        with:
          repository: Tritbool/euc_ble_library
          ref: fa3fe6715a908ea7e8fd3f4365a0be2b854685d2
          path: .ci/euc-ble-library
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Publish BLE library to Maven Local
        working-directory: .ci/euc-ble-library
        run: bash ./gradlew :euc-ble-core:publishToMavenLocal --no-daemon

      - name: Run unit tests and lint
        run: ./gradlew :app:lintDebug --no-daemon
