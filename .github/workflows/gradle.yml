name: Android Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Sign and verify APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          : "${KEYSTORE_BASE64:?Secret KEYSTORE_BASE64 absent}"
          : "${KEY_ALIAS:?Secret KEY_ALIAS absent}"
          : "${KEYSTORE_PASSWORD:?Secret KEYSTORE_PASSWORD absent}"
          : "${KEY_PASSWORD:?Secret KEY_PASSWORD absent}"
          : "${ANDROID_HOME:?Variable ANDROID_HOME absente}"

          KEYSTORE="$RUNNER_TEMP/release.keystore"
          ALIGNED="$RUNNER_TEMP/release-aligned.apk"
          trap 'rm -f "$KEYSTORE" "$ALIGNED"' EXIT

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

          BUILD_TOOLS="$(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 -maxdepth 1 -type d |
              sort -V |
              tail -n 1
          )"

          if [[ ! -x "$BUILD_TOOLS/zipalign" || ! -x "$BUILD_TOOLS/apksigner" ]]; then
            echo "Erreur : zipalign ou apksigner absent des Android Build Tools."
            exit 1
          fi

          shopt -s nullglob
          APKS=(app/build/outputs/apk/release/*-unsigned.apk)

          if (( ${#APKS[@]} != 1 )); then
            echo "Erreur : attendu exactement un APK non signé, trouvé ${#APKS[@]}."
            exit 1
          fi

          mkdir -p dist
          OUTPUT="dist/TuxWheel.apk"

          "$BUILD_TOOLS/zipalign" -f -v 4 "${APKS[0]}" "$ALIGNED"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --v4-signing-enabled false \
            --out "$OUTPUT" \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify --verbose "$OUTPUT"

      - name: Upload APK to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: true
          files: dist/TuxWheel.apk
